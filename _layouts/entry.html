<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }} — Matej Dubec</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Lora:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
</head>
<body>

<div class="grain"></div>

<div class="page entry-page">

  <a href="{{ '/' | relative_url }}" class="entry-back">&larr; Back to the notebook</a>

  <article class="entry">
    <p class="card__meta">{{ page.type | default: page.category }}</p>
    <h1 class="entry__title">{{ page.title }}</h1>
    <p class="entry__date">{{ page.date | date: "%B %-d, %Y" }}</p>

    {% if page.image %}
    <div class="entry__image">
      <img src="{{ page.image | relative_url }}" alt="{{ page.title }}">
    </div>
    {% endif %}

    <div class="entry__body">
      {{ content }}
    </div>

    {% if page.link %}
    <p><a href="{{ page.link }}" class="link" target="_blank" rel="noopener">Visit project &rarr;</a></p>
    {% endif %}
  </article>

</div>

</body>
</html>
